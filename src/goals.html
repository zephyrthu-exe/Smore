<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smore — Savings Goals</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("smore-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- External Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/sombo.css">
</head>
<body class="bg-light">

<div class="d-flex">
  <!-- Sidebar Navigation -->
  <aside class="app-sidebar p-3 d-flex flex-column justify-content-between" style="width: 260px; min-height: 100vh; background-color: #000000;">
    <div>
      <div class="brand-logo d-flex align-items-center gap-2 mb-4 px-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span class="fs-5 fw-bold text-white">Smore</span>
      </div>

      <nav class="nav flex-column gap-1">
        <a href="dashboard.html" class="sidebar-link d-flex align-items-center gap-2 px-3 py-2 text-white-50 rounded" style="text-decoration: none;"><i class="bi bi-grid"></i> Dashboard</a>
        <a href="transaction.html" class="sidebar-link d-flex align-items-center gap-2 px-3 py-2 text-white-50 rounded" style="text-decoration: none;"><i class="bi bi-list-task"></i> Transactions</a>
        <a href="transaction.html#addTxModal" class="mobile-add-action d-flex align-items-center justify-content-center" aria-label="Add transaction"><i class="bi bi-plus-lg" aria-hidden="true"></i></a>
        <a href="budget.html" class="sidebar-link d-flex align-items-center gap-2 px-3 py-2 text-white-50 rounded" style="text-decoration: none;"><i class="bi bi-wallet2"></i> Budgets</a>
        <a href="goals.html" class="sidebar-link mobile-secondary-link active d-flex align-items-center gap-2 px-3 py-2 text-white rounded" style="background-color: rgba(255,255,255,0.1); text-decoration: none;"><i class="bi bi-piggy-bank"></i> Savings Goals</a>
        <a href="analytics.html" class="sidebar-link mobile-secondary-link d-flex align-items-center gap-2 px-3 py-2 text-white-50 rounded" style="text-decoration: none;"><i class="bi bi-bar-chart"></i> Analytics</a>
        <hr style="border-color: rgba(255,255,255,0.12); margin: 6px 0;">
        <a href="#" class="sidebar-link desktop-customize-link d-flex align-items-center gap-2 px-3 py-2 text-white-50 rounded" id="desktopCustomizeBotNavBtn" style="text-decoration: none;"><i class="bi bi-sliders"></i> Customize my bot</a>
        <button type="button" class="sidebar-link more-nav-button d-flex align-items-center gap-2 text-white-50 rounded" id="mobileMoreBtn" aria-label="More options" aria-expanded="false"><i class="bi bi-three-dots"></i> More</button>
      </nav>
      <div class="mobile-more-menu" id="mobileMoreMenu" aria-label="More navigation" hidden>
        <a href="goals.html" class="is-current"><i class="bi bi-piggy-bank"></i> Savings Goals</a>
        <a href="analytics.html"><i class="bi bi-bar-chart"></i> Analytics</a>
        <button type="button" id="accountSettingsBtn"><i class="bi bi-person-gear"></i> Account settings</button>
      </div>
    </div>

    <!-- User Account -->
    <div class="profile-wrap" id="profileWrap">
      <button class="profile-chip" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="sidebarAvatar">U</span>
        <span class="flex-grow-1 min-w-0">
          <span class="d-block small fw-semibold text-truncate" id="userNameDisplay">User</span>
          <span class="d-block text-white-50" style="font-size: 0.75rem">Smore Account</span>
        </span>
        <i class="bi bi-chevron-right text-white-50"></i>
      </button>

      <div class="profile-card" role="menu">
        <div class="text-center px-4 pt-4 pb-3">
          <div class="avatar mx-auto mb-2" style="width: 62px; height: 62px; font-size: 1.25rem" id="dropdownAvatar">
            U
          </div>
          <div class="fw-semibold" id="userEmailDisplay">user@example.com</div>
        </div>

        <div class="border-top p-3">
          <button class="btn btn-danger w-100 rounded-3" id="sidebarLogoutBtn">
            <i class="bi bi-box-arrow-right"></i> Log Out
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-grow-1 p-4">
    <!-- Header Controls -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h4 fw-bold mb-1">Savings Goals</h1>
        <p class="text-muted small mb-0">Stay motivated by tracking progress on your financial targets.</p>
      </div>

      <button class="btn btn-sm btn-dark fw-bold px-3 d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#addGoalModal">
        <i class="bi bi-plus-lg"></i> Add New Goal
      </button>
    </div>

    <!-- Goals Grid -->
    <div class="row g-3 bento-grid" id="goalsGridContainer">
      <!-- Dynamic Goals Rendered by JS -->
    </div>
  </main>
</div>

<!-- ================= MODAL: ADD NEW GOAL ================= -->
<div class="modal fade" id="addGoalModal" tabindex="-1" aria-labelledby="addGoalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom-0">
        <h5 class="modal-title fw-bold fs-6" id="addGoalTitle">Add New Savings Goal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="addGoalForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="goalTitle">Goal Title</label>
            <input type="text" class="form-control" id="goalTitle" placeholder="e.g. New Laptop, Emergency Fund" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="goalAmount">Target Amount (MMK)</label>
            <input type="number" class="form-control" id="goalAmount" placeholder="500000" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="goalInitial">Initial Saved Amount (MMK)</label>
            <input type="number" class="form-control" id="goalInitial" placeholder="0" min="0">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="goalDate">Target Date</label>
            <input type="date" class="form-control" id="goalDate" required>
          </div>
        </div>
        <div class="modal-footer border-top-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark" id="saveGoalBtn">Create Goal</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/goals.js"></script>
</body>
</html>
